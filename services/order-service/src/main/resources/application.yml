spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate       # Flyway owns the schema. Hibernate only checks it.
    open-in-view: false        # keeps DB sessions out of view rendering
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful           # finish in-flight requests on SIGTERM
  port: 8082

orders:
  # The hold window the saga asks inventory-service for. It is the customer's
  # time to enter a card, and it is stock held out of the shop, so it is a
  # business decision rather than a technical one.
  hold-ttl-seconds: ${ORDER_HOLD_TTL_SECONDS:900}
  currency: ${ORDER_CURRENCY:INR}
  # The shop's local time: a 14:00 cut-off means 14:00 where the courier calls.
  dispatch-zone: ${ORDER_DISPATCH_ZONE:Asia/Kolkata}
  dispatch-scan-interval-ms: ${ORDER_DISPATCH_SCAN_MS:60000}
  # How often to ask payment-service about orders whose payment never answered.
  # Unlike the dispatch watcher, this one is load-bearing: stop it and those
  # orders never finish. It is still safe -- an unresolved order is never
  # treated as paid -- so stopping it delays the answer rather than corrupting
  # it. Watch the orders_payment_unresolved gauge.
  payment-reconcile-interval-ms: ${ORDER_PAYMENT_RECONCILE_MS:30000}
  # How long an order may sit at one step before the recovery scan treats it as
  # abandoned by a dead process. Must exceed the slowest checkout that could
  # still be in flight, or recovery races the request already finishing the job.
  stuck-after-ms: ${ORDER_STUCK_AFTER_MS:120000}
  recovery-scan-interval-ms: ${ORDER_RECOVERY_SCAN_MS:60000}

inquiries:
  # The pgcrypto passphrase for tank_inquiry's email, phone and message columns.
  #
  # There is deliberately no default. An empty value is not "use a fallback",
  # it is "refuse the write" -- see TankInquiryRepository and ADR 0021. A
  # fallback key would write rows that look encrypted and are readable by anyone
  # holding this file, then orphan them the day a real key arrives.
  #
  # Empty is survivable, though, and only for this one endpoint: the service
  # starts normally, the checkout saga is untouched, and POST /v1/inquiries
  # alone answers 503. A bolt-on form's missing Secret must not be able to take
  # the commerce path down with it.
  #
  # The value comes from a Kubernetes Secret that is NOT in this repository and
  # must not be: docs/runbooks/rotate-or-create-the-inquiry-key.md has the one
  # command that creates it.
  encryption-key: ${INQUIRY_ENCRYPTION_KEY:}

inventory:
  base-url: ${INVENTORY_BASE_URL:http://inventory-service:8081}
  connect-timeout-ms: ${INVENTORY_CONNECT_TIMEOUT_MS:1000}
  read-timeout-ms: ${INVENTORY_READ_TIMEOUT_MS:2000}

payment:
  # `stub` keeps checkout self-contained for the core profile and the test
  # suite; `http` uses the real payment-service. Only the second can produce an
  # unresolved payment, which is the case worth exercising.
  gateway: ${PAYMENT_GATEWAY:stub}
  base-url: ${PAYMENT_BASE_URL:http://payment-service:8083}
  connect-timeout-ms: ${PAYMENT_CONNECT_TIMEOUT_MS:1000}
  # Longer than the inventory timeout on purpose: an abandoned inventory call is
  # free to retry, an abandoned payment call may already have taken the money.
  read-timeout-ms: ${PAYMENT_READ_TIMEOUT_MS:5000}
  stub:
    # APPROVE or DECLINE. A stub until payment-service exists; the outcome is
    # configuration rather than a request field, because a test hook in the API
    # would let anyone who can place an order choose whether to pay.
    outcome: ${PAYMENT_STUB_OUTCOME:APPROVE}

notification:
  # `noop` (default) keeps core and commerce exactly as they behaved before
  # this client existed; `http` is only ever set by the full-app profile,
  # which is the only profile that deploys notification-service. See ADR 0020
  # for why this is a push, not a NATS subscription, until Phase 6.
  client: ${NOTIFICATION_CLIENT:noop}
  base-url: ${NOTIFICATION_BASE_URL:http://notification-service:8085}
  # Deliberately the shortest timeouts in this service: nothing waits on this
  # call, so there is no reason to hold a thread open for it.
  connect-timeout-ms: ${NOTIFICATION_CONNECT_TIMEOUT_MS:400}
  read-timeout-ms: ${NOTIFICATION_READ_TIMEOUT_MS:800}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      service: order-service

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
