apiVersion: v1
kind: ConfigMap
metadata:
  name: staff-portal-config
  namespace: aquashop-dev
data:
  CATALOG_BASE_URL: http://catalog-service:8080
  INVENTORY_BASE_URL: http://inventory-service:8081
  ORDER_BASE_URL: http://order-service:8082
  # Matches storefront's own upstream-call discipline (CATALOG_TIMEOUT_MS).
  BACKEND_TIMEOUT_MS: "2000"
---
apiVersion: v1
kind: Service
metadata:
  name: staff-portal
  namespace: aquashop-dev
  labels:
    app: staff-portal
spec:
  selector:
    app: staff-portal
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staff-portal
  namespace: aquashop-dev
  labels:
    app: staff-portal
    aquashop.io/profile: full-app
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0 / maxSurge: 1 (every other deployment's setting here)
      # deadlocks the very first deploy into a fullish namespace: a stuck
      # ImagePullBackOff pod on the manifest's placeholder tag never becomes
      # eligible for removal, so its ResourceQuota reservation starves the
      # replacement pod's own request and neither side can ever proceed.
      # staff-portal is read-only and internal-only, so a slower one-at-a-time
      # rollout costs nothing here. Found by running a fresh full-app deploy
      # (16-17 Sep 2026); see RELEASE-NOTES.md.
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: staff-portal
  template:
    metadata:
      labels:
        app: staff-portal
    spec:
      # WildFly's own graceful shutdown (SIGTERM triggers a managed
      # undeploy/stop, not an abrupt kill) needs real time, more than the
      # 20s Go gets and more even than the other JVM services -- unmeasured,
      # so this is a starting point to correct after the first real
      # `kubectl delete pod` is timed, not a verified figure.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # The official quay.io/wildfly/wildfly image already runs as a
        # non-root `jboss` user -- confirmed by actually running `id` inside
        # the pulled image while building this, not assumed the way the
        # distroless UID mistake happened the first time around. See the
        # Dockerfile for how the image itself is built.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: staff-portal
          image: aquashop/staff-portal:PLACEHOLDER   # CI rewrites this to the git SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: staff-portal-config }
          securityContext:
            allowPrivilegeEscalation: false
            # Not read-only: WildFly writes to its own standalone/data,
            # standalone/tmp and standalone/log directories at runtime even
            # with the console-logging change in the Dockerfile (deployment
            # marker files, in particular). This is a real, stated
            # difference from every distroless Go/Rust service in this
            # platform, not an oversight -- a full application server
            # needs a writable install directory the way a static binary
            # does not.
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          # Measured in-cluster (full-app profile, 17 Sep 2026): ~4.1s boot,
          # far under this generous window -- consistent with the ~2.8s
          # standalone measurement, and not the "slow-start" this platform's
          # docs originally assumed. Left generous anyway: one clean boot on
          # an idle node isn't evidence it stays fast under load or on a
          # busier node, and the failure mode of a startup probe that's too
          # tight (a false OOMKilled/restart loop) is worse than one that's
          # merely too generous.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 40
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            # Measured in-cluster (full-app profile, 17 Sep 2026): 456 MiB
            # resident, settled -- comfortable headroom under both the
            # request and the limit below, not a tight fit. Left as originally
            # sized rather than tightened to the observed figure: one
            # settled measurement on an idle node is a floor, not a ceiling,
            # and a full JBoss/WildFly install's footprint under real request
            # load is still unmeasured.
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
