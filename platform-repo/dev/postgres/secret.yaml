# Phase 1 only. Plaintext in Git is a placeholder, not a pattern: Phase 5
# replaces this with External Secrets + SOPS, and the AWS target is Secrets
# Manager read through IRSA. The local-to-cloud document records this gap.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: aquashop-dev
type: Opaque
stringData:
  POSTGRES_PASSWORD: devsuperuser
  CATALOG_PASSWORD: devcatalog
  INVENTORY_PASSWORD: devinventory
  ORDERS_PASSWORD: devorders
  PAYMENTS_PASSWORD: devpayments
  # payment-service takes a whole URL rather than parts, because sqlx does. The
  # password is in it, which is exactly why this file is the largest gap in the
  # repository until Phase 6 replaces it with External Secrets + SOPS.
  PAYMENTS_DATABASE_URL: postgres://payments:devpayments@postgres.aquashop-dev.svc.cluster.local:5432/payments
  NOTIFY_PASSWORD: devnotify
