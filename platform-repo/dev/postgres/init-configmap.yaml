apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: aquashop-dev
data:
  # Runs once, on an empty data directory -- so adding a service here does
  # nothing to a cluster that already has a PVC. Adding the role to a running
  # cluster is docs/runbooks/add-a-service-database.md; the alternative, a
  # bootstrap that deletes the volume, would make "add a service" mean "lose
  # every order in dev".
  #
  # Runs once, on an empty data directory. One database and one role per
  # service, and the role can reach nothing else. This is the local stand-in
  # for one RDS instance per service: credential isolation is faithful,
  # blast-radius isolation is not.
  00-roles.sql: |
    CREATE ROLE catalog LOGIN PASSWORD 'devcatalog';
    CREATE DATABASE catalog OWNER catalog;
    REVOKE ALL ON DATABASE catalog FROM PUBLIC;
    GRANT CONNECT ON DATABASE catalog TO catalog;

    CREATE ROLE inventory LOGIN PASSWORD 'devinventory';
    CREATE DATABASE inventory OWNER inventory;
    REVOKE ALL ON DATABASE inventory FROM PUBLIC;
    GRANT CONNECT ON DATABASE inventory TO inventory;

    CREATE ROLE orders LOGIN PASSWORD 'devorders';
    CREATE DATABASE orders OWNER orders;
    REVOKE ALL ON DATABASE orders FROM PUBLIC;
    GRANT CONNECT ON DATABASE orders TO orders;

    CREATE ROLE payments LOGIN PASSWORD 'devpayments';
    CREATE DATABASE payments OWNER payments;
    REVOKE ALL ON DATABASE payments FROM PUBLIC;
    GRANT CONNECT ON DATABASE payments TO payments;

    CREATE ROLE notify LOGIN PASSWORD 'devnotify';
    CREATE DATABASE notify OWNER notify;
    REVOKE ALL ON DATABASE notify FROM PUBLIC;
    GRANT CONNECT ON DATABASE notify TO notify;
