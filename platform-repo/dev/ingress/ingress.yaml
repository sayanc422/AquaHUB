apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aquashop
  namespace: aquashop-dev
  annotations:
    cert-manager.io/cluster-issuer: aquashop-ca-issuer
    nginx.ingress.kubernetes.io/proxy-read-timeout: "10"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [aquashop.localtest.me]
      secretName: aquashop-tls
  rules:
    - host: aquashop.localtest.me       # localtest.me resolves to 127.0.0.1, no /etc/hosts edit
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port: { number: 3000 }
          # Exposed for demonstration and curl. In the AWS design this path is
          # not public: the ALB fronts the storefront only.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port: { number: 8080 }
