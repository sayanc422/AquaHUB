# Self-signed CA locally; the AWS target is an ACM certificate on the ALB, so
# TLS termination moves from in-cluster to the load balancer. That difference
# is recorded in the local-to-cloud document.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: aquashop-selfsigned-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aquashop-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: aquashop-local-ca
  secretName: aquashop-ca-key-pair
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: aquashop-selfsigned-root, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: aquashop-ca-issuer
spec:
  ca:
    secretName: aquashop-ca-key-pair
