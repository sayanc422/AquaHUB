apiVersion: v1
kind: Namespace
metadata:
  name: aquashop-dev
  labels:
    app.kubernetes.io/part-of: aquashop
    aquashop.io/environment: dev
---
# Ceiling for the whole environment. On an 11 GB WSL budget this is what stops a
# bad `resources.requests` from taking the cluster down instead of the pod.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aquashop-dev-quota
  namespace: aquashop-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.memory: 4Gi
    pods: "20"
    # No `limits.cpu` here, on purpose, and this is not an omission.
    #
    # A ResourceQuota that counts limits.cpu makes a CPU limit *mandatory*: any
    # container without one is rejected. Combined with a LimitRange default, it
    # is worse than that -- the pod is not rejected, it silently receives the
    # default limit and is CFS-throttled. That is exactly the behaviour ADR 0006
    # says this platform does not want, arriving by way of the namespace rather
    # than the deployment, where nobody would think to look for it.
    #
    # Memory is still capped, because memory is not compressible.
---
# Anything without explicit resources gets these, so an unbounded pod cannot
# exist in this namespace by accident.
apiVersion: v1
kind: LimitRange
metadata:
  name: aquashop-dev-defaults
  namespace: aquashop-dev
spec:
  limits:
    - type: Container
      default:
        # Memory only. A default CPU *limit* would throttle every container that
        # deliberately omits one -- see the note on the quota above.
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
