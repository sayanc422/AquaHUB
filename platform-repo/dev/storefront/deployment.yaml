apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: aquashop-dev
spec:
  selector:
    app: storefront
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: aquashop-dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        # See catalog/deployment.yaml: the distroless nonroot image's USER is a
        # name, not a UID, so runAsNonRoot alone cannot be verified by kubelet.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: storefront
          image: aquashop/storefront:PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: CATALOG_BASE_URL
              value: http://catalog-service.aquashop-dev.svc.cluster.local:8080
            - name: CATALOG_TIMEOUT_MS
              value: "2000"
            # New with the custom tank-setup enquiry form (ADR 0021). This is
            # the storefront's first call to order-service -- checkout is not
            # wired through the BFF -- so the variable is new, not a rename.
            #
            # Note what this means for the `core` profile: core deploys the
            # storefront without order-service, so the form is reachable there
            # and every submission fails. It fails honestly (502, the
            # customer's text kept, "we could not reach the shop") rather than
            # silently, but core is not a profile this feature works in.
            - name: ORDER_BASE_URL
              value: http://order-service.aquashop-dev.svc.cluster.local:8082
            # Bounded at 2 s like the catalog call, for the same reason: an
            # unbounded upstream call lets one slow service fill this BFF's
            # connection pool and take the whole shop down with it.
            - name: ORDER_TIMEOUT_MS
              value: "2000"
            # The footer's Contact Us block. PLACEHOLDERS until the owner
            # supplies real ones: a WhatsApp value with fewer than 10 digits
            # renders as plain text rather than a wa.me link to nobody.
            # Replace with e.g. "+91 98765 43210" and a real address, then
            # `kubectl apply -k` -- no image rebuild needed.
            - name: CONTACT_WHATSAPP
              value: "+91 XXXXX XXXXX"
            - name: CONTACT_EMAIL
              value: "contact@example.com"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 12
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits:   { memory: 160Mi }
