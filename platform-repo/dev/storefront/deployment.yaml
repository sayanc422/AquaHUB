apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: aquashop-dev
spec:
  selector:
    app: storefront
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: aquashop-dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        # See catalog/deployment.yaml: the distroless nonroot image's USER is a
        # name, not a UID, so runAsNonRoot alone cannot be verified by kubelet.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: storefront
          image: aquashop/storefront:PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: CATALOG_BASE_URL
              value: http://catalog-service.aquashop-dev.svc.cluster.local:8080
            - name: CATALOG_TIMEOUT_MS
              value: "2000"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 12
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits:   { memory: 160Mi }
