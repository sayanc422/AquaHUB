<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1000"
     viewBox="0 0 1480 1000" font-family="DejaVu Sans, Segoe UI, sans-serif" role="img" aria-label="AquaShop delivery flow">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#93a1bd"/></marker>
  <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker>
  <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a4d"/></marker>
</defs>
<rect width="1480" height="1000" fill="#0f1725"/>
<rect x="48" y="34" width="7" height="46" fill="#3ddc97"/><text x="70" y="76" font-size="36" font-weight="700" fill="#e6ecf5"><tspan fill="#3ddc97">Delivery</tspan> Flow — Two Repositories</text><text x="72" y="102" font-size="14" fill="#93a1bd">Nobody runs kubectl apply. Promotion is a pull request.</text><rect x="1050" y="44" width="79.6" height="22" rx="11" fill="#3ddc97" opacity="0.14"/><rect x="1050" y="44" width="79.6" height="22" rx="11" fill="none" stroke="#3ddc97" opacity="0.55"/><text x="1089.8" y="59" font-size="11" text-anchor="middle" fill="#3ddc97" font-weight="600">APP REPO</text><rect x="1139.6" y="44" width="101.2" height="22" rx="11" fill="#8b7bf7" opacity="0.14"/><rect x="1139.6" y="44" width="101.2" height="22" rx="11" fill="none" stroke="#8b7bf7" opacity="0.55"/><text x="1190.1999999999998" y="59" font-size="11" text-anchor="middle" fill="#8b7bf7" font-weight="600">GITOPS REPO</text><line x1="48" y1="130" x2="1432" y2="130" stroke="#2b3654" stroke-dasharray="3 6"/><text x="48" y="122" font-size="11" fill="#93a1bd" font-weight="700" text-anchor="start">DEVELOPER</text><line x1="48" y1="254" x2="1432" y2="254" stroke="#2b3654" stroke-dasharray="3 6"/><text x="48" y="246" font-size="11" fill="#93a1bd" font-weight="700" text-anchor="start">AQUASHOP (APP REPO)</text><line x1="48" y1="424" x2="1432" y2="424" stroke="#2b3654" stroke-dasharray="3 6"/><text x="48" y="416" font-size="11" fill="#93a1bd" font-weight="700" text-anchor="start">GITHUB ACTIONS</text><line x1="48" y1="594" x2="1432" y2="594" stroke="#2b3654" stroke-dasharray="3 6"/><text x="48" y="586" font-size="11" fill="#93a1bd" font-weight="700" text-anchor="start">AQUASHOP-PLATFORM (GITOPS REPO)</text><line x1="48" y1="764" x2="1432" y2="764" stroke="#2b3654" stroke-dasharray="3 6"/><text x="48" y="756" font-size="11" fill="#93a1bd" font-weight="700" text-anchor="start">CLUSTER</text><rect x="60" y="138" width="230" height="62" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="74" y="162" font-size="14.5" font-weight="700" fill="#3ddc97">feature branch</text><text x="74" y="181" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">git push</text><line x1="250" y1="200" x2="250" y2="250" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><rect x="60" y="250" width="230" height="62" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="74" y="274" font-size="14.5" font-weight="700" fill="#3ddc97">Pull request</text><text x="74" y="293" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">review + required checks</text><line x1="290" y1="281" x2="356" y2="281" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><rect x="356" y="250" width="230" height="62" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="370" y="274" font-size="14.5" font-weight="700" fill="#3ddc97">merge to main</text><text x="370" y="293" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">squash, one commit</text><line x1="471" y1="312" x2="471" y2="420" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><rect x="60" y="420" width="122" height="58" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="74" y="454.0" font-size="14.5" font-weight="700" fill="#e6ecf5">lint</text><rect x="196" y="420" width="122" height="58" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="210" y="454.0" font-size="14.5" font-weight="700" fill="#e6ecf5">unit + IT</text><line x1="184" y1="449" x2="194" y2="449" stroke="#93a1bd" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="332" y="420" width="146" height="58" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="346" y="454.0" font-size="14.5" font-weight="700" fill="#e6ecf5">coverage gate</text><line x1="320" y1="449" x2="330" y2="449" stroke="#93a1bd" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="492" y="420" width="122" height="58" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="506" y="454.0" font-size="14.5" font-weight="700" fill="#e6ecf5">Trivy scan</text><line x1="480" y1="449" x2="490" y2="449" stroke="#93a1bd" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="636" y="420" width="122" height="58" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="650" y="454.0" font-size="14.5" font-weight="700" fill="#e6ecf5">buildx</text><line x1="624" y1="449" x2="634" y2="449" stroke="#93a1bd" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="772" y="420" width="122" height="58" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="786" y="454.0" font-size="14.5" font-weight="700" fill="#e6ecf5">push :&lt;sha&gt;</text><line x1="760" y1="449" x2="770" y2="449" stroke="#93a1bd" stroke-width="1.6" marker-end="url(#arrow)"/><text x="60" y="502" font-size="11.5" fill="#55617d" font-weight="400" text-anchor="start">Image tag is the git SHA. Never :latest — a mutable tag makes rollback a guess and makes</text><text x="60" y="520" font-size="11.5" fill="#55617d" font-weight="400" text-anchor="start">&#x27;which image is running&#x27; unanswerable from the cluster.</text><rect x="938" y="420" width="200" height="58" rx="9" fill="#1d2740" stroke="#8b7bf7" stroke-width="1.5"/><text x="952" y="454.0" font-size="14.5" font-weight="700" fill="#8b7bf7">PR to GitOps repo</text><line x1="908" y1="449" x2="932" y2="449" stroke="#8b7bf7" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="1038" y1="478" x2="1038" y2="590" stroke="#8b7bf7" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="60" y="590" width="300" height="74" rx="9" fill="#1d2740" stroke="#8b7bf7" stroke-width="1.5"/><text x="74" y="614" font-size="14.5" font-weight="700" fill="#8b7bf7">dev overlay</text><text x="74" y="633" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">image tag bumped automatically</text><rect x="400" y="590" width="300" height="74" rx="9" fill="#1d2740" stroke="#8b7bf7" stroke-width="1.5"/><text x="414" y="614" font-size="14.5" font-weight="700" fill="#8b7bf7">uat overlay</text><text x="414" y="633" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">promotion PR, human approval</text><rect x="740" y="590" width="300" height="74" rx="9" fill="#1d2740" stroke="#8b7bf7" stroke-width="1.5"/><text x="754" y="614" font-size="14.5" font-weight="700" fill="#8b7bf7">prod overlay</text><text x="754" y="633" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">promotion PR, human approval</text><line x1="360" y1="627" x2="394" y2="627" stroke="#93a1bd" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="700" y1="627" x2="734" y2="627" stroke="#93a1bd" stroke-width="1.6" marker-end="url(#arrow)"/><text x="60" y="692" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">The GitOps commit log is the literal deployment history: every change to what runs is a commit,</text><text x="60" y="710" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">and a rollback is `git revert` of that commit, not a command typed against a cluster.</text><rect x="60" y="760" width="300" height="74" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="74" y="784" font-size="14.5" font-weight="700" fill="#3ddc97">Argo CD app-of-apps</text><text x="74" y="803" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">auto-sync + self-heal on dev</text><line x1="210" y1="664" x2="210" y2="754" stroke="#8b7bf7" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="400" y="760" width="300" height="74" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="414" y="784" font-size="14.5" font-weight="700" fill="#3ddc97">aquashop-dev namespace</text><text x="414" y="803" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">rolling update, maxUnavailable 0</text><line x1="360" y1="797" x2="394" y2="797" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><rect x="740" y="760" width="300" height="74" rx="9" fill="#1d2740" stroke="#ff9a4d" stroke-width="1.5"/><text x="754" y="784" font-size="14.5" font-weight="700" fill="#ff9a4d">uat / prod namespaces</text><text x="754" y="803" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">replicas: 0 until materialised</text><line x1="700" y1="797" x2="734" y2="797" stroke="#ff9a4d" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowO)"/><rect x="1080" y="590" width="352" height="252" rx="12" fill="#182032" stroke="#8b7bf7" stroke-width="1.5"/><text x="1098" y="616" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">INTERVIEW HOOKS</text><text x="1100" y="642" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">Why two repos: a CI bot writing to the app</text><text x="1100" y="662" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">repo would retrigger CI on its own commit.</text><text x="1100" y="682" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start"></text><text x="1100" y="702" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">Drift: Argo self-heal reverts a manual</text><text x="1100" y="722" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">kubectl edit within seconds; that is the</text><text x="1100" y="742" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">point, and it is also how you lock yourself</text><text x="1100" y="762" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">out of an emergency fix.</text><text x="1100" y="782" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start"></text><text x="1100" y="802" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">Rollback: revert the tag-bump commit.</text><text x="1100" y="822" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">Mean time to recover = sync interval.</text><line x1="48" y1="900" x2="1432" y2="900" stroke="#2b3654"/><text x="48" y="926" font-size="12" fill="#93a1bd" font-weight="400" text-anchor="start">Definition of done for this flow: a merged pull request deploys a new version with no manual kubectl anywhere.</text><text x="1432" y="926" font-size="11" fill="#55617d" font-weight="400" text-anchor="end">AquaShop  /  docs/diagrams/delivery-flow.svg</text></svg>