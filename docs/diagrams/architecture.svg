<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1120"
     viewBox="0 0 1480 1120" font-family="DejaVu Sans, Segoe UI, sans-serif" role="img" aria-label="AquaShop system architecture">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#93a1bd"/></marker>
  <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker>
  <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a4d"/></marker>
</defs>
<rect width="1480" height="1120" fill="#0f1725"/>
<rect x="48" y="34" width="7" height="46" fill="#3ddc97"/><text x="70" y="76" font-size="36" font-weight="700" fill="#e6ecf5">AquaShop <tspan fill="#3ddc97">System</tspan> Architecture</text><text x="72" y="102" font-size="14" fill="#93a1bd">All eight services are built and run together in k3d. Messaging, observability and GitOps remain planned.</text><rect x="1000" y="44" width="151.6" height="22" rx="11" fill="#3ddc97" opacity="0.14"/><rect x="1000" y="44" width="151.6" height="22" rx="11" fill="none" stroke="#3ddc97" opacity="0.55"/><text x="1075.8" y="59" font-size="11" text-anchor="middle" fill="#3ddc97" font-weight="600">BUILT, RUNS IN k3d</text><rect x="1161.6" y="44" width="72.4" height="22" rx="11" fill="#55617d" opacity="0.14"/><rect x="1161.6" y="44" width="72.4" height="22" rx="11" fill="none" stroke="#55617d" opacity="0.55"/><text x="1197.8" y="59" font-size="11" text-anchor="middle" fill="#55617d" font-weight="600">PLANNED</text><rect x="48" y="120" width="880" height="250" rx="12" fill="#182032" stroke="#4cc9f0" stroke-width="1.5"/><text x="66" y="146" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">EDGE AND CLIENT</text><rect x="72" y="158" width="220" height="74" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="86" y="182" font-size="14.5" font-weight="700" fill="#3ddc97">Browser</text><text x="86" y="201" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">https://aquashop.localtest.me</text><text x="86" y="220" font-size="11.5" fill="#55617d">TLS to ingress, self-signed CA</text><rect x="336" y="158" width="250" height="74" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="350" y="182" font-size="14.5" font-weight="700" fill="#3ddc97">ingress-nginx</text><text x="350" y="201" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">IngressClass: nginx</text><text x="350" y="220" font-size="11.5" fill="#55617d">hostPort 80/443 on the k3d node</text><rect x="630" y="158" width="274" height="74" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="644" y="182" font-size="14.5" font-weight="700" fill="#3ddc97">cert-manager</text><text x="644" y="201" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">ClusterIssuer: aquashop-ca-issuer</text><text x="644" y="220" font-size="11.5" fill="#55617d">issues the in-cluster leaf certificate</text><line x1="292" y1="195" x2="330" y2="195" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><line x1="586" y1="195" x2="624" y2="195" stroke="#93a1bd" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="340" y="268" font-size="12.5" fill="#93a1bd" font-weight="400" text-anchor="start">AWS counterpart: Route 53 -&gt; ACM -&gt; ALB (AWS Load Balancer Controller).</text><text x="340" y="290" font-size="12" fill="#55617d" font-weight="400" text-anchor="start">What differs locally: TLS terminates inside the cluster at ingress-nginx, not at the load balancer,</text><text x="340" y="310" font-size="12" fill="#55617d" font-weight="400" text-anchor="start">so ALB listener rules, target-group health checks and WAF association are unvalidated.</text><text x="340" y="340" font-size="12" fill="#55617d" font-weight="400" text-anchor="start" font-style="italic">Everything below runs in one k3d node container inside WSL2.</text><rect x="956" y="120" width="476" height="250" rx="12" fill="#182032" stroke="#8b7bf7" stroke-width="1.5"/><text x="974" y="146" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">CROSS-CUTTING</text><rect x="980" y="158" width="200" height="60" rx="9" fill="#1d2740" stroke="#55617d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="994" y="182" font-size="14.5" font-weight="700" fill="#93a1bd">Observability</text><text x="994" y="201" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">OTel -&gt; Prometheus</text><rect x="1196" y="158" width="212" height="60" rx="9" fill="#1d2740" stroke="#55617d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1210" y="182" font-size="14.5" font-weight="700" fill="#93a1bd">GitOps</text><text x="1210" y="201" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Argo CD app-of-apps</text><rect x="980" y="232" width="200" height="60" rx="9" fill="#1d2740" stroke="#55617d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="994" y="256" font-size="14.5" font-weight="700" fill="#93a1bd">CI</text><text x="994" y="275" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">GH Actions per service</text><rect x="1196" y="232" width="212" height="60" rx="9" fill="#1d2740" stroke="#ff9a4d" stroke-width="1.5"/><text x="1210" y="256" font-size="14.5" font-weight="700" fill="#ff9a4d">Infrastructure</text><text x="1210" y="275" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Terraform, never applied</text><text x="980" y="322" font-size="12" fill="#93a1bd" font-weight="400" text-anchor="start">The Terraform layer is validated with `terraform test`</text><text x="980" y="342" font-size="12" fill="#ff9a4d" font-weight="400" text-anchor="start">and mock providers. It has never been applied to an account.</text><rect x="48" y="400" width="1384" height="128" rx="12" fill="#182032" stroke="#3ddc97" stroke-width="1.5"/><text x="66" y="426" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">BACKEND FOR FRONTEND</text><rect x="72" y="438" width="320" height="72" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="86" y="462" font-size="14.5" font-weight="700" fill="#3ddc97">storefront</text><text x="86" y="481" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">TypeScript / Fastify</text><text x="86" y="500" font-size="11.5" fill="#55617d">SSR HTML, br/gzip, bounded upstream calls</text><rect x="324" y="449" width="56" height="19" rx="9.5" fill="none" stroke="#3ddc97" stroke-width="1.2"/><text x="352.0" y="462.5" font-size="10" letter-spacing="0.9" text-anchor="middle" fill="#3ddc97">BUILT</text><text x="420" y="458" font-size="12.5" fill="#93a1bd" font-weight="400" text-anchor="start">Calls three services: catalog (every page), order (enquiry form), advisor (tank checker).</text><text x="420" y="480" font-size="12" fill="#55617d" font-weight="400" text-anchor="start">Owns no data; a 60s in-memory cache holds the category tree and product list.</text><text x="420" y="500" font-size="12" fill="#55617d" font-weight="400" text-anchor="start">Readiness checks the catalog only: an order or advisor outage fails one feature, not the shop.</text><line x1="182" y1="236" x2="182" y2="432" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><rect x="48" y="558" width="1384" height="214" rx="12" fill="#182032" stroke="#ff9a4d" stroke-width="1.5"/><text x="66" y="584" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">DOMAIN SERVICES — ONE DATABASE EACH, NO SHARED SCHEMA</text><rect x="72" y="596" width="172" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="86" y="620" font-size="14.5" font-weight="700" fill="#3ddc97">catalog</text><text x="86" y="639" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Java 21 / Spring Boot</text><text x="86" y="658" font-size="11.5" fill="#55617d">products, species profiles</text><line x1="158.0" y1="512" x2="158.0" y2="590" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><rect x="260" y="596" width="172" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="274" y="620" font-size="14.5" font-weight="700" fill="#3ddc97">order</text><text x="274" y="639" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Java 21 / Spring Boot</text><text x="274" y="658" font-size="11.5" fill="#55617d">checkout saga, order state</text><line x1="346.0" y1="512" x2="346.0" y2="590" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><rect x="448" y="596" width="172" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="462" y="620" font-size="14.5" font-weight="700" fill="#3ddc97">inventory</text><text x="462" y="639" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Go</text><text x="462" y="658" font-size="11.5" fill="#55617d">tank stock, TTL holds</text><rect x="636" y="596" width="172" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="650" y="620" font-size="14.5" font-weight="700" fill="#3ddc97">payment</text><text x="650" y="639" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Rust / Axum</text><text x="650" y="658" font-size="11.5" fill="#55617d">auth, capture, ledger</text><rect x="824" y="596" width="172" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="838" y="620" font-size="14.5" font-weight="700" fill="#3ddc97">aquatics-advisor</text><text x="838" y="639" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Python / FastAPI</text><text x="838" y="658" font-size="11.5" fill="#55617d">compatibility rules</text><line x1="910.0" y1="512" x2="910.0" y2="590" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><rect x="1012" y="596" width="172" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="1026" y="620" font-size="14.5" font-weight="700" fill="#3ddc97">notification</text><text x="1026" y="639" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Go</text><text x="1026" y="658" font-size="11.5" fill="#55617d">email + webhook fan-out</text><rect x="1200" y="596" width="172" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="1214" y="620" font-size="14.5" font-weight="700" fill="#3ddc97">staff-portal</text><text x="1214" y="639" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">JSP / WildFly</text><text x="1214" y="658" font-size="11.5" fill="#55617d">read-only back-office</text><text x="190" y="722" font-size="12" fill="#93a1bd" font-weight="400" text-anchor="start">order-service drives the checkout saga: it calls inventory (reserve, commit) and payment (authorise), then pushes to notification.</text><text x="190" y="742" font-size="12" fill="#55617d" font-weight="400" text-anchor="start">Every language choice is justified by a property of the service. Rust holds the money state machine because exhaustive matching is worth its slow build.</text><rect x="48" y="800" width="660" height="118" rx="12" fill="#182032" stroke="#8b7bf7" stroke-width="1.5"/><text x="66" y="826" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">ASYNCHRONOUS</text><rect x="72" y="838" width="612" height="62" rx="9" fill="#1d2740" stroke="#55617d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="86" y="862" font-size="14.5" font-weight="700" fill="#93a1bd">NATS JetStream</text><text x="86" y="881" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">subjects: order.*, inventory.*, payment.*</text><text x="72" y="946" font-size="11.5" fill="#55617d" font-weight="400" text-anchor="start">Chosen over Kafka: no consumer needs log replay or partition ordering, and Kafka costs ~1 GB</text><text x="72" y="964" font-size="11.5" fill="#55617d" font-weight="400" text-anchor="start">that this machine does not have. AWS counterpart: Amazon MQ / MSK (mapping documented).</text><rect x="736" y="800" width="696" height="118" rx="12" fill="#182032" stroke="#4cc9f0" stroke-width="1.5"/><text x="754" y="826" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">DATA — SHARED INSTANCE, ISOLATED DATABASES</text><rect x="760" y="838" width="648" height="62" rx="9" fill="#1d2740" stroke="#4cc9f0" stroke-width="1.5"/><text x="774" y="862" font-size="14.5" font-weight="700" fill="#4cc9f0">PostgreSQL 16 (StatefulSet, local-path PVC)</text><text x="774" y="881" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">catalog | orders | inventory | payments | notify  (advisor owns none)</text><text x="760" y="946" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">One database and one login role per service; each role has CONNECT on its own database only.</text><text x="760" y="964" font-size="11.5" fill="#ff9a4d" font-weight="400" text-anchor="start">Faithful: credential isolation, no cross-service joins. NOT faithful: blast radius — one restart</text><text x="760" y="982" font-size="11.5" fill="#ff9a4d" font-weight="400" text-anchor="start">takes every service down, which per-service RDS instances in the target design would not.</text><path d="M158,700 L158,792 L900,792 L900,830" fill="none" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><text x="560" y="784" font-size="10.5" fill="#3ddc97" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">JDBC / Hikari, pool max 10</text><line x1="48" y1="1040" x2="1432" y2="1040" stroke="#2b3654"/><text x="48" y="1066" font-size="12" fill="#93a1bd" font-weight="400" text-anchor="start">Designed for AWS  •  validated with terraform test and mock providers  •  run on k3d  •  never applied</text><text x="1432" y="1066" font-size="11" fill="#55617d" font-weight="400" text-anchor="end">AquaShop  /  docs/diagrams/architecture.svg</text></svg>