<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1080"
     viewBox="0 0 1480 1080" font-family="DejaVu Sans, Segoe UI, sans-serif" role="img" aria-label="AquaShop operations: update and troubleshoot">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#93a1bd"/></marker>
  <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker>
  <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a4d"/></marker>
</defs>
<rect width="1480" height="1080" fill="#0f1725"/>
<rect x="48" y="34" width="7" height="46" fill="#3ddc97"/><text x="70" y="76" font-size="36" font-weight="700" fill="#e6ecf5">Operating It <tspan fill="#3ddc97">Without Claude</tspan></text><text x="72" y="102" font-size="14" fill="#93a1bd">Left: getting a change into the cluster. Right: finding the layer that broke.</text><rect x="48" y="120" width="700" height="880" rx="12" fill="#182032" stroke="#3ddc97" stroke-width="1.5"/><text x="66" y="146" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">UPDATE LOOP — SCRIPTS/REDEPLOY.SH</text><rect x="72" y="160" width="652" height="88" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="86" y="184" font-size="14.5" font-weight="700" fill="#3ddc97">1  git pull</text><text x="86" y="203" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">git pull origin claude/clever-shannon-ivtkw6</text><text x="86" y="222" font-size="11.5" fill="#55617d">note the old commit first</text><line x1="398" y1="248" x2="398" y2="268" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><rect x="72" y="272" width="652" height="88" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="86" y="296" font-size="14.5" font-weight="700" fill="#3ddc97">2  what changed?</text><text x="86" y="315" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">git diff --name-only OLD HEAD -- services</text><text x="86" y="334" font-size="11.5" fill="#55617d">one folder = one service to rebuild</text><line x1="398" y1="360" x2="398" y2="380" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><rect x="72" y="384" width="652" height="88" rx="9" fill="#1d2740" stroke="#ff9a4d" stroke-width="1.5"/><text x="86" y="408" font-size="14.5" font-weight="700" fill="#ff9a4d">3  build all</text><text x="86" y="427" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">docker build -t aquashop/&lt;svc&gt;:git-&lt;sha&gt;</text><text x="86" y="446" font-size="11.5" fill="#55617d">a compile error stops here; cluster untouched</text><line x1="398" y1="472" x2="398" y2="492" stroke="#ff9a4d" stroke-width="1.6" marker-end="url(#arrowO)"/><rect x="72" y="496" width="652" height="88" rx="9" fill="#1d2740" stroke="#ff9a4d" stroke-width="1.5"/><text x="86" y="520" font-size="14.5" font-weight="700" fill="#ff9a4d">4  import</text><text x="86" y="539" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">k3d image import -c aquashop ...</text><text x="86" y="558" font-size="11.5" fill="#55617d">no registry: into the node&#x27;s containerd</text><line x1="398" y1="584" x2="398" y2="604" stroke="#ff9a4d" stroke-width="1.6" marker-end="url(#arrowO)"/><rect x="72" y="608" width="652" height="88" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="86" y="632" font-size="14.5" font-weight="700" fill="#3ddc97">5  roll out</text><text x="86" y="651" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">kubectl set image deploy/&lt;svc&gt; ...</text><text x="86" y="670" font-size="11.5" fill="#55617d">new tag = spec change = real rollout</text><line x1="398" y1="696" x2="398" y2="716" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><rect x="72" y="720" width="652" height="88" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="86" y="744" font-size="14.5" font-weight="700" fill="#3ddc97">6  wait</text><text x="86" y="763" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">kubectl rollout status --timeout</text><text x="86" y="782" font-size="11.5" fill="#55617d">JVMs run Flyway inside the startup probe</text><line x1="398" y1="808" x2="398" y2="828" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><rect x="72" y="832" width="652" height="88" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="86" y="856" font-size="14.5" font-weight="700" fill="#3ddc97">7  verify</text><text x="86" y="875" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">get pods; curl -H &#x27;Accept-Encoding: br&#x27;; browser</text><text x="86" y="894" font-size="11.5" fill="#55617d">old pods gone? storefront cache 60 s</text><rect x="72" y="944" width="652" height="44" rx="9" fill="#1d2740" stroke="#f0546a" stroke-width="1.5"/><text x="86" y="971.0" font-size="14.5" font-weight="700" fill="#f0546a">wrong?  kubectl rollout undo deployment/&lt;svc&gt;   (does not undo a migration)</text><rect x="776" y="120" width="656" height="880" rx="12" fill="#182032" stroke="#ff9a4d" stroke-width="1.5"/><text x="794" y="146" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">TROUBLESHOOT BOTTOM-UP — STOP AT THE FIRST FAILURE</text><rect x="800" y="160" width="608" height="76" rx="9" fill="#1d2740" stroke="#8b7bf7" stroke-width="1.5"/><text x="814" y="184" font-size="14.5" font-weight="700" fill="#8b7bf7">7  Browser</text><text x="814" y="203" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">blank page? curl -H &#x27;Accept-Encoding: br&#x27; size 0</text><rect x="800" y="256" width="608" height="76" rx="9" fill="#1d2740" stroke="#8b7bf7" stroke-width="1.5"/><text x="814" y="280" font-size="14.5" font-weight="700" fill="#8b7bf7">6  Ingress</text><text x="814" y="299" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">curl -kv https://aquashop.localtest.me/healthz</text><rect x="800" y="352" width="608" height="76" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="814" y="376" font-size="14.5" font-weight="700" fill="#3ddc97">5  Service</text><text x="814" y="395" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">kubectl logs &lt;pod&gt; --previous</text><rect x="800" y="448" width="608" height="76" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="814" y="472" font-size="14.5" font-weight="700" fill="#3ddc97">4  Pod</text><text x="814" y="491" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">get pods; describe pod; events</text><rect x="800" y="544" width="608" height="76" rx="9" fill="#1d2740" stroke="#4cc9f0" stroke-width="1.5"/><text x="814" y="568" font-size="14.5" font-weight="700" fill="#4cc9f0">3  Kubernetes</text><text x="814" y="587" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">config current-context; get nodes</text><rect x="800" y="640" width="608" height="76" rx="9" fill="#1d2740" stroke="#4cc9f0" stroke-width="1.5"/><text x="814" y="664" font-size="14.5" font-weight="700" fill="#4cc9f0">2  Docker / k3d</text><text x="814" y="683" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">docker ps; k3d cluster list / start</text><rect x="800" y="736" width="608" height="76" rx="9" fill="#1d2740" stroke="#ff9a4d" stroke-width="1.5"/><text x="814" y="760" font-size="14.5" font-weight="700" fill="#ff9a4d">1  WSL2</text><text x="814" y="779" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">free -m; df -h; sudo service docker start</text><line x1="1420" y1="810" x2="1420" y2="180" stroke="#93a1bd" stroke-width="1.6" marker-end="url(#arrow)"/><text x="800" y="862" font-size="12.5" fill="#e6ecf5" font-weight="700" text-anchor="start">Pod status -&gt; first command:</text><text x="816" y="886" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">- Pending -&gt; describe pod (quota? memory?)</text><text x="816" y="906" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">- ImagePullBackOff -&gt; image is :PLACEHOLDER or never imported</text><text x="816" y="926" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">- CreateContainerConfigError -&gt; missing Secret / runAsUser</text><text x="816" y="946" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">- CrashLoopBackOff -&gt; logs --previous (Flyway? DB?)</text><text x="816" y="966" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">- OOMKilled / 137 -&gt; runbooks/pod-oomkilled.md</text><line x1="48" y1="1030" x2="1432" y2="1030" stroke="#2b3654"/><text x="48" y="1056" font-size="12" fill="#93a1bd" font-weight="400" text-anchor="start">Full procedure, command reference and failure table: docs/operations-guide.md</text><text x="1432" y="1056" font-size="11" fill="#55617d" font-weight="400" text-anchor="end">AquaShop  /  docs/diagrams/operations.svg</text></svg>