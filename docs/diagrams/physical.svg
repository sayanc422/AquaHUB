<rect x="48" y="34" width="7" height="46" fill="#3ddc97"/><text x="70" y="76" font-size="36" font-weight="700" fill="#e6ecf5"><tspan fill="#3ddc97">Physical</tspan> Deployment — this machine</text><text x="72" y="102" font-size="14" fill="#93a1bd">Where every process, port and byte of data actually lives. Read off the live machine, 30 Sep 2026.</text><rect x="1030" y="44" width="151.6" height="22" rx="11" fill="#3ddc97" opacity="0.14"/><rect x="1030" y="44" width="151.6" height="22" rx="11" fill="none" stroke="#3ddc97" opacity="0.55"/><text x="1105.8" y="59" font-size="11" text-anchor="middle" fill="#3ddc97" font-weight="600">SURVIVES --destroy</text><rect x="1191.6" y="44" width="144.4" height="22" rx="11" fill="#f0546a" opacity="0.14"/><rect x="1191.6" y="44" width="144.4" height="22" rx="11" fill="none" stroke="#f0546a" opacity="0.55"/><text x="1263.8" y="59" font-size="11" text-anchor="middle" fill="#f0546a" font-weight="600">LOST ON --destroy</text><rect x="48" y="120" width="1384" height="150" rx="12" fill="#182032" stroke="#4cc9f0" stroke-width="1.5"/><text x="66" y="146" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">WINDOWS 11 HOST — 16 GB RAM</text><rect x="72" y="158" width="420" height="90" rx="9" fill="#1d2740" stroke="#4cc9f0" stroke-width="1.5"/><text x="86" y="182" font-size="14.5" font-weight="700" fill="#4cc9f0">Browser (Windows side)</text><text x="86" y="201" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">https://aquashop.localtest.me</text><text x="86" y="220" font-size="11.5" fill="#55617d">https://staff.aquashop.localtest.me   -&gt; both resolve to 127.0.0.1</text><rect x="516" y="158" width="420" height="90" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="530" y="182" font-size="14.5" font-weight="700" fill="#e6ecf5">WSL localhost forwarding</text><text x="530" y="201" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">127.0.0.1:80 / :443  -&gt;  WSL2 VM</text><text x="530" y="220" font-size="11.5" fill="#55617d">no /etc/hosts or Windows hosts-file edit needed</text><rect x="960" y="158" width="448" height="90" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="974" y="182" font-size="14.5" font-weight="700" fill="#e6ecf5">C:\Users\sayan\.wslconfig</text><text x="974" y="201" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">memory=11GB  processors=4  swap=4GB</text><text x="974" y="220" font-size="11.5" fill="#55617d">changes apply only after `wsl --shutdown` (PowerShell)</text><line x1="492" y1="203" x2="510" y2="203" stroke="#4cc9f0" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="48" y="290" width="1384" height="1130" rx="12" fill="#182032" stroke="#3ddc97" stroke-width="1.5"/><text x="66" y="316" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">WSL2 VM — UBUNTU, 11 GIB RAM, 4 VCPU, 4 GIB SWAP, EXT4 1007 GB (44 GB USED)</text><rect x="72" y="332" width="360" height="84" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="86" y="356" font-size="14.5" font-weight="700" fill="#e6ecf5">systemd=true (/etc/wsl.conf)</text><text x="86" y="375" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">docker.service enabled</text><text x="86" y="394" font-size="11.5" fill="#55617d">Docker starts when WSL starts</text><rect x="72" y="430" width="360" height="84" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="86" y="454" font-size="14.5" font-weight="700" fill="#3ddc97">Repository</text><text x="86" y="473" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">~/Config-Scripts/Repo/AquaHUB</text><text x="86" y="492" font-size="11.5" fill="#55617d">branch claude/clever-shannon-ivtkw6</text><rect x="72" y="528" width="360" height="84" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="86" y="552" font-size="14.5" font-weight="700" fill="#e6ecf5">kubeconfig</text><text x="86" y="571" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">~/.kube/config</text><text x="86" y="590" font-size="11.5" fill="#55617d">context k3d-aquashop -&gt; 0.0.0.0:37127</text><rect x="72" y="626" width="360" height="84" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="86" y="650" font-size="14.5" font-weight="700" fill="#e6ecf5">CLI tools</text><text x="86" y="669" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">docker 29.8 k3d 5.9 kubectl 1.37</text><text x="86" y="688" font-size="11.5" fill="#55617d">helm 3.22, python3 (diagrams)</text><rect x="72" y="724" width="360" height="84" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="86" y="748" font-size="14.5" font-weight="700" fill="#3ddc97">Build-cache volumes (named)</text><text x="86" y="767" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">aquashop-m2  aquashop-npm</text><text x="86" y="786" font-size="11.5" fill="#55617d">aquashop-maven-repo  maven-repo-cache</text><rect x="72" y="822" width="360" height="84" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="86" y="846" font-size="14.5" font-weight="700" fill="#3ddc97">Tool images</text><text x="86" y="865" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">playwright:v1.48.0-jammy</text><text x="86" y="884" font-size="11.5" fill="#55617d">PDF + screenshots; maven:3.9 for tests</text><rect x="72" y="920" width="360" height="84" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="86" y="944" font-size="14.5" font-weight="700" fill="#3ddc97">Service images (host copy)</text><text x="86" y="963" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">aquashop/&lt;service&gt;:dev</text><text x="86" y="982" font-size="11.5" fill="#55617d">built by bootstrap.sh, then imported</text><text x="72" y="1032" font-size="11.5" fill="#55617d" font-weight="400" text-anchor="start">No native node, JDK or cargo: every build</text><text x="72" y="1050" font-size="11.5" fill="#55617d" font-weight="400" text-anchor="start">and test runs inside a container.</text><rect x="456" y="332" width="952" height="1068" rx="12" fill="#182032" stroke="#8b7bf7" stroke-width="1.5"/><text x="474" y="358" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">DOCKER ENGINE — /VAR/LIB/DOCKER — BRIDGE NETWORK K3D-AQUASHOP</text><rect x="480" y="366" width="904" height="74" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="494" y="390" font-size="14.5" font-weight="700" fill="#e6ecf5">container  k3d-aquashop-serverlb</text><text x="494" y="409" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">ghcr.io/k3d-io/k3d-proxy:5.9.0</text><text x="494" y="428" font-size="11.5" fill="#55617d">host 0.0.0.0:37127 -&gt; 6443: the Kubernetes API that kubectl talks to</text><rect x="480" y="452" width="904" height="926" rx="9" fill="#182032" stroke="#3ddc97" stroke-width="1.5"/><text x="494" y="476" font-size="14.5" font-weight="700" fill="#3ddc97">container  k3d-aquashop-server-0</text><text x="494" y="495" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">rancher/k3s:v1.30.4-k3s1  172.18.0.3  restart: unless-stopped</text><text x="494" y="514" font-size="11.5" fill="#55617d">host 0.0.0.0:80 and :443 -&gt; ingress-nginx hostPort. The whole cluster is this one container.</text><text x="500" y="538" font-size="11.5" fill="#93a1bd" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">NAMESPACE  ingress-nginx</text><rect x="500" y="548" width="864" height="58" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="514" y="572" font-size="14.5" font-weight="700" fill="#e6ecf5">ingress-nginx-controller  :80 :443</text><text x="514" y="591" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">aquashop.localtest.me /  -&gt; storefront:3000    /api -&gt; catalog-service:8080</text><text x="514" y="622" font-size="11" fill="#55617d" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">staff.aquashop.localtest.me /  -&gt; staff-portal:8080    TLS: Secret aquashop-tls (cert-manager, self-signed CA)</text><text x="500" y="656" font-size="11.5" fill="#93a1bd" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">NAMESPACES  cert-manager  kube-system</text><rect x="500" y="666" width="864" height="44" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="514" y="693.0" font-size="14.5" font-weight="700" fill="#93a1bd">cert-manager (3 pods)   coredns   local-path-provisioner   metrics-server</text><text x="500" y="740" font-size="11.5" fill="#93a1bd" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">NAMESPACE  aquashop-dev   (Service port shown; all ClusterIP, none reachable from Windows directly)</text><rect x="500.0" y="752" width="207.0" height="50" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="514.0" y="776" font-size="14.5" font-weight="700" fill="#3ddc97">storefront</text><text x="514.0" y="795" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">:3000</text><rect x="719.0" y="752" width="207.0" height="50" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="733.0" y="776" font-size="14.5" font-weight="700" fill="#3ddc97">catalog-service</text><text x="733.0" y="795" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">:8080</text><rect x="938.0" y="752" width="207.0" height="50" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="952.0" y="776" font-size="14.5" font-weight="700" fill="#3ddc97">order-service</text><text x="952.0" y="795" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">:8082</text><rect x="1157.0" y="752" width="207.0" height="50" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="1171.0" y="776" font-size="14.5" font-weight="700" fill="#3ddc97">inventory-service</text><text x="1171.0" y="795" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">:8081</text><rect x="500.0" y="812" width="207.0" height="50" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="514.0" y="836" font-size="14.5" font-weight="700" fill="#3ddc97">payment-service</text><text x="514.0" y="855" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">:8083</text><rect x="719.0" y="812" width="207.0" height="50" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="733.0" y="836" font-size="14.5" font-weight="700" fill="#3ddc97">aquatics-advisor</text><text x="733.0" y="855" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">:8084</text><rect x="938.0" y="812" width="207.0" height="50" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="952.0" y="836" font-size="14.5" font-weight="700" fill="#3ddc97">notification-service</text><text x="952.0" y="855" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">:8085</text><rect x="1157.0" y="812" width="207.0" height="50" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="1171.0" y="836" font-size="14.5" font-weight="700" fill="#3ddc97">staff-portal</text><text x="1171.0" y="855" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">:8080</text><rect x="500" y="876" width="864" height="50" rx="9" fill="#1d2740" stroke="#4cc9f0" stroke-width="1.5"/><text x="514" y="900" font-size="14.5" font-weight="700" fill="#4cc9f0">postgres-0  :5432 (headless)</text><text x="514" y="919" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">postgres:16-alpine   databases: catalog orders inventory payments notify</text><rect x="500" y="936" width="864" height="44" rx="9" fill="#1d2740" stroke="#f0546a" stroke-width="1.5"/><text x="514" y="963.0" font-size="14.5" font-weight="700" fill="#f0546a">Secrets: postgres-credentials, aquashop-tls, order-inquiry-key (made by hand, in no file)</text><text x="500" y="1012" font-size="11.5" fill="#93a1bd" font-weight="700" text-anchor="start">INSIDE THE NODE CONTAINER&#x27;S FILESYSTEM</text><rect x="500" y="1024" width="864" height="44" rx="7" fill="#1d2740" stroke="#f0546a" stroke-width="1.3"/><text x="514" y="1043" font-size="12" fill="#f0546a" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">/var/lib/rancher/k3s</text><text x="514" y="1060" font-size="11" fill="#93a1bd" font-weight="400" text-anchor="start">anonymous volume  —  k3s datastore (every object, every Secret) + storage/pvc-..._data-postgres-0 = Postgres, 95 MB</text><rect x="500" y="1078" width="864" height="44" rx="7" fill="#1d2740" stroke="#f0546a" stroke-width="1.3"/><text x="514" y="1097" font-size="12" fill="#f0546a" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">/var/lib/kubelet  /var/lib/cni  /var/log</text><text x="514" y="1114" font-size="11" fill="#93a1bd" font-weight="400" text-anchor="start">anonymous volumes  —  pod sandboxes, CNI state, container logs</text><rect x="500" y="1132" width="864" height="44" rx="7" fill="#1d2740" stroke="#f0546a" stroke-width="1.3"/><text x="514" y="1151" font-size="12" fill="#f0546a" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">containerd image store</text><text x="514" y="1168" font-size="11" fill="#93a1bd" font-weight="400" text-anchor="start">inside the node  —  8 aquashop/*:dev images, 5 MB (Go) to 476 MB (WildFly)</text><rect x="500" y="1186" width="864" height="44" rx="7" fill="#1d2740" stroke="#55617d" stroke-width="1.3"/><text x="514" y="1205" font-size="12" fill="#93a1bd" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">/k3d/images</text><text x="514" y="1222" font-size="11" fill="#93a1bd" font-weight="400" text-anchor="start">named volume k3d-aquashop-images  —  staging area for `k3d image import`</text><rect x="500" y="1246" width="864" height="104" rx="9" fill="#f0546a" fill-opacity="0.10" stroke="#f0546a" stroke-width="1.5"/><text x="516" y="1272" font-size="14" fill="#f0546a" font-weight="700" text-anchor="start">k3d cluster delete  (= bootstrap.sh --destroy)  deletes the database.</text><text x="516" y="1294" font-size="11.5" fill="#e6ecf5" font-weight="400" text-anchor="start">It removes server-0 and its anonymous volumes: verified 30 Sep 2026 on a throwaway cluster. Orders,</text><text x="516" y="1312" font-size="11.5" fill="#e6ecf5" font-weight="400" text-anchor="start">enquiries, Flyway history and the order-inquiry-key Secret all go. Back up first: pg_dumpall plus</text><text x="516" y="1330" font-size="11.5" fill="#e6ecf5" font-weight="400" text-anchor="start">the key&#x27;s value (docs/operations-guide.md, section 7). A WSL restart or k3d cluster stop loses nothing.</text><path d="M282,248 L282,276 L1420,276 L1420,470 L1384,470" fill="none" stroke="#4cc9f0" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1180" y="268" font-size="10.5" fill="#4cc9f0" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">HTTPS :443 via localhost forwarding</text><line x1="432" y1="528" x2="476" y2="403" stroke="#93a1bd" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="438" y="500" font-size="10.5" fill="#93a1bd" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">kubectl</text><line x1="48" y1="1460" x2="1432" y2="1460" stroke="#2b3654"/><text x="48" y="1486" font-size="12" fill="#93a1bd" font-weight="400" text-anchor="start">Survives a WSL restart: everything (restart: unless-stopped). Survives --destroy: only the repo, the host images and the named volumes.</text><text x="1432" y="1486" font-size="11" fill="#55617d" font-weight="400" text-anchor="end">AquaShop  /  docs/diagrams/physical.svg</text></svg>