<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1340"
     viewBox="0 0 1480 1340" font-family="DejaVu Sans, Segoe UI, sans-serif" role="img" aria-label="AquaShop physical deployment">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#93a1bd"/></marker>
  <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker>
  <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a4d"/></marker>
</defs>
<rect width="1480" height="1340" fill="#0f1725"/>
<rect x="48" y="34" width="7" height="46" fill="#3ddc97"/><text x="70" y="76" font-size="36" font-weight="700" fill="#e6ecf5"><tspan fill="#3ddc97">Physical</tspan> Deployment — One Laptop</text><text x="72" y="102" font-size="14" fill="#93a1bd">Every layer between a browser on Windows and a row in Postgres, with ports, images and storage.</text><rect x="1040" y="44" width="72.4" height="22" rx="11" fill="#3ddc97" opacity="0.14"/><rect x="1040" y="44" width="72.4" height="22" rx="11" fill="none" stroke="#3ddc97" opacity="0.55"/><text x="1076.2" y="59" font-size="11" text-anchor="middle" fill="#3ddc97" font-weight="600">REQUEST</text><rect x="1122.4" y="44" width="58.0" height="22" rx="11" fill="#ff9a4d" opacity="0.14"/><rect x="1122.4" y="44" width="58.0" height="22" rx="11" fill="none" stroke="#ff9a4d" opacity="0.55"/><text x="1151.4" y="59" font-size="11" text-anchor="middle" fill="#ff9a4d" font-weight="600">IMAGE</text><rect x="1190.4" y="44" width="50.8" height="22" rx="11" fill="#4cc9f0" opacity="0.14"/><rect x="1190.4" y="44" width="50.8" height="22" rx="11" fill="none" stroke="#4cc9f0" opacity="0.55"/><text x="1215.8000000000002" y="59" font-size="11" text-anchor="middle" fill="#4cc9f0" font-weight="600">DATA</text><rect x="48" y="120" width="1384" height="1100" rx="12" fill="#182032" stroke="#2b3654" stroke-width="1.5"/><text x="66" y="146" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">WINDOWS 11 HOST — 16 GB RAM</text><rect x="72" y="158" width="300" height="76" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="86" y="182" font-size="14.5" font-weight="700" fill="#3ddc97">Browser (Windows)</text><text x="86" y="201" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">https://aquashop.localtest.me</text><text x="86" y="220" font-size="11.5" fill="#55617d">localtest.me -&gt; 127.0.0.1 on public DNS</text><rect x="396" y="158" width="300" height="76" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="410" y="182" font-size="14.5" font-weight="700" fill="#93a1bd">C:\Users\&lt;you&gt;\.wslconfig</text><text x="410" y="201" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">memory=11GB swap=4GB</text><text x="410" y="220" font-size="11.5" fill="#55617d">applied with wsl --shutdown</text><rect x="720" y="158" width="300" height="76" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="734" y="182" font-size="14.5" font-weight="700" fill="#3ddc97">Staff browser tab</text><text x="734" y="201" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">https://staff.aquashop.localtest.me</text><text x="734" y="220" font-size="11.5" fill="#55617d">same port 443, routed on the Host header</text><text x="1050" y="190" font-size="12" fill="#93a1bd" font-weight="400" text-anchor="start">WSL2 forwards Windows localhost:80/443</text><text x="1050" y="210" font-size="12" fill="#93a1bd" font-weight="400" text-anchor="start">into the Linux VM (localhost forwarding).</text><rect x="72" y="256" width="1336" height="940" rx="12" fill="#182032" stroke="#8b7bf7" stroke-width="1.5"/><text x="130" y="282" font-size="13" fill="#8b7bf7" font-weight="700" text-anchor="start">WSL2 VM — UBUNTU, ~11 GB USABLE (MEASURED 22 SEP 2026)</text><rect x="130" y="296" width="360" height="84" rx="9" fill="#1d2740" stroke="#ff9a4d" stroke-width="1.5"/><text x="144" y="320" font-size="14.5" font-weight="700" fill="#ff9a4d">~/AquaHUB (git clone, Linux FS)</text><text x="144" y="339" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">services/*/Dockerfile</text><text x="144" y="358" font-size="11.5" fill="#55617d">never /mnt/c: cross-FS builds are slow</text><rect x="514" y="296" width="420" height="84" rx="9" fill="#1d2740" stroke="#ff9a4d" stroke-width="1.5"/><text x="528" y="320" font-size="14.5" font-weight="700" fill="#ff9a4d">Docker Engine (dockerd, native in WSL)</text><text x="528" y="339" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">images: aquashop/&lt;svc&gt;:&lt;tag&gt;</text><text x="528" y="358" font-size="11.5" fill="#55617d">docker build runs here, not in the cluster</text><rect x="958" y="296" width="426" height="84" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="972" y="320" font-size="14.5" font-weight="700" fill="#e6ecf5">kubectl / k3d / helm (CLI)</text><text x="972" y="339" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">context: k3d-aquashop</text><text x="972" y="358" font-size="11.5" fill="#55617d">API via container k3d-aquashop-serverlb</text><line x1="490" y1="338" x2="508" y2="338" stroke="#ff9a4d" stroke-width="1.6" marker-end="url(#arrowO)"/><text x="499" y="396" font-size="10.5" fill="#ff9a4d" font-weight="400" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">docker build</text><rect x="120" y="414" width="1264" height="762" rx="12" fill="#182032" stroke="#3ddc97" stroke-width="1.5"/><text x="138" y="440" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">DOCKER CONTAINER K3D-AQUASHOP-SERVER-0 — K3S V1.30.4, ONE NODE</text><rect x="144" y="454" width="380" height="76" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="158" y="478" font-size="14.5" font-weight="700" fill="#3ddc97">ingress-nginx (ns ingress-nginx)</text><text x="158" y="497" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">hostPort 80/443 &lt;- docker -p 80,443</text><text x="158" y="516" font-size="11.5" fill="#55617d">TLS ends here; cert from cert-manager&#x27;s own CA</text><rect x="548" y="454" width="392" height="76" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="562" y="478" font-size="14.5" font-weight="700" fill="#e6ecf5">cert-manager (ns cert-manager)</text><text x="562" y="497" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">ClusterIssuer aquashop-ca-issuer</text><text x="562" y="516" font-size="11.5" fill="#55617d">one cert, two SANs: aquashop + staff</text><rect x="964" y="454" width="396" height="76" rx="9" fill="#1d2740" stroke="#ff9a4d" stroke-width="1.5"/><text x="978" y="478" font-size="14.5" font-weight="700" fill="#ff9a4d">containerd (the node&#x27;s image store)</text><text x="978" y="497" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">k3d image import copies images in</text><text x="978" y="516" font-size="11.5" fill="#55617d">imagePullPolicy IfNotPresent; no registry</text><path d="M100,234 L100,492 L138,492" fill="none" stroke="#3ddc97" stroke-width="1.8" marker-end="url(#arrowT)"/><text x="108" y="250" font-size="10.5" fill="#3ddc97" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">127.0.0.1:443</text><path d="M860,380 L860,400 L1160,400 L1160,448" fill="none" stroke="#ff9a4d" stroke-width="1.6" marker-end="url(#arrowO)"/><text x="1170" y="398" font-size="10.5" fill="#ff9a4d" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">k3d image import</text><rect x="144" y="556" width="1216" height="454" rx="12" fill="#182032" stroke="#ff9a4d" stroke-width="1.5"/><text x="162" y="582" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">NAMESPACE AQUASHOP-DEV — QUOTA: REQUESTS 3GI, LIMITS.MEMORY 4GI, 20 PODS, NO LIMITS.CPU</text><line x1="334" y1="530" x2="334" y2="552" stroke="#3ddc97" stroke-width="1.6" marker-end="url(#arrowT)"/><rect x="168" y="596" width="280" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="182" y="620" font-size="14.5" font-weight="700" fill="#3ddc97">storefront</text><text x="182" y="639" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Service :3000  (Node, distroless)</text><text x="182" y="658" font-size="11.5" fill="#55617d">req 96Mi / lim 160Mi</text><rect x="464" y="596" width="280" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="478" y="620" font-size="14.5" font-weight="700" fill="#3ddc97">catalog-service</text><text x="478" y="639" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Service :8080  (JVM, distroless)</text><text x="478" y="658" font-size="11.5" fill="#55617d">req 448Mi / lim 640Mi</text><rect x="760" y="596" width="280" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="774" y="620" font-size="14.5" font-weight="700" fill="#3ddc97">order-service</text><text x="774" y="639" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Service :8082  (JVM, distroless)</text><text x="774" y="658" font-size="11.5" fill="#55617d">req 448Mi / lim 640Mi</text><rect x="1056" y="596" width="280" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="1070" y="620" font-size="14.5" font-weight="700" fill="#3ddc97">inventory-service</text><text x="1070" y="639" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Service :8081  (Go, distroless)</text><text x="1070" y="658" font-size="11.5" fill="#55617d">req 64Mi / lim 96Mi</text><rect x="168" y="712" width="280" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="182" y="736" font-size="14.5" font-weight="700" fill="#3ddc97">payment-service</text><text x="182" y="755" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Service :8083  (Rust, distroless)</text><text x="182" y="774" font-size="11.5" fill="#55617d">req 32Mi / lim 64Mi</text><rect x="464" y="712" width="280" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="478" y="736" font-size="14.5" font-weight="700" fill="#3ddc97">aquatics-advisor</text><text x="478" y="755" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Service :8084  (Python slim)</text><text x="478" y="774" font-size="11.5" fill="#55617d">req 96Mi / lim 160Mi</text><rect x="760" y="712" width="280" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="774" y="736" font-size="14.5" font-weight="700" fill="#3ddc97">notification-service</text><text x="774" y="755" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Service :8085  (Go, distroless)</text><text x="774" y="774" font-size="11.5" fill="#55617d">req 64Mi / lim 96Mi</text><rect x="1056" y="712" width="280" height="96" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="1070" y="736" font-size="14.5" font-weight="700" fill="#3ddc97">staff-portal</text><text x="1070" y="755" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Service :8080  (WildFly 33)</text><text x="1070" y="774" font-size="11.5" fill="#55617d">req 512Mi / lim 1Gi</text><text x="168" y="838" font-size="12" fill="#93a1bd" font-weight="400" text-anchor="start">Sum of requests 1952 Mi, of limits 3200 Mi (from the manifests): inside the quota with ~1 GiB spare.</text><text x="168" y="858" font-size="12" fill="#55617d" font-weight="400" text-anchor="start">runAsUser 65532 on every distroless pod; rollouts maxUnavailable 0 (staff-portal: 1, surge 0).</text><rect x="168" y="878" width="580" height="106" rx="9" fill="#1d2740" stroke="#4cc9f0" stroke-width="1.5"/><text x="182" y="902" font-size="14.5" font-weight="700" fill="#4cc9f0">postgres-0 (StatefulSet, postgres:16-alpine)</text><text x="182" y="921" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Service :5432  |  req 192Mi / lim 320Mi</text><text x="182" y="940" font-size="11.5" fill="#55617d">databases: catalog, inventory, orders, payments, notify</text><rect x="772" y="878" width="564" height="106" rx="9" fill="#1d2740" stroke="#4cc9f0" stroke-width="1.5"/><text x="786" y="902" font-size="14.5" font-weight="700" fill="#4cc9f0">PVC data-postgres-0 — 2Gi, local-path</text><text x="786" y="921" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">/var/lib/rancher/k3s/storage (node container)</text><text x="786" y="940" font-size="11.5" fill="#55617d">deleted with the cluster (bootstrap.sh --destroy)</text><line x1="748" y1="930" x2="766" y2="930" stroke="#4cc9f0" stroke-width="1.6" marker-end="url(#arrow)"/><text x="144" y="1040" font-size="12" fill="#ff9a4d" font-weight="400" text-anchor="start">Secrets: postgres-credentials (plaintext in Git, dev only)  |  order-inquiry-key (created by hand, never in Git; ADR 0021)</text><text x="144" y="1064" font-size="12" fill="#55617d" font-weight="400" text-anchor="start">Not deployed: NATS, Argo CD, Prometheus/Tempo/OTel (no manifests). No uat/prod namespace.</text><text x="144" y="1088" font-size="12" fill="#3ddc97" font-weight="400" text-anchor="start">Request path: browser -&gt; 127.0.0.1:443 -&gt; WSL -&gt; docker port map -&gt; ingress-nginx -&gt; Service -&gt; pod.</text><text x="144" y="1112" font-size="12" fill="#ff9a4d" font-weight="400" text-anchor="start">Image path: services/&lt;svc&gt; -&gt; docker build -&gt; Docker image store -&gt; k3d image import -&gt; containerd -&gt; kubelet.</text><text x="144" y="1136" font-size="12" fill="#4cc9f0" font-weight="400" text-anchor="start">Data path: pod -&gt; postgres Service :5432 -&gt; postgres-0 -&gt; local-path PVC on the node container&#x27;s filesystem.</text><line x1="48" y1="1250" x2="1432" y2="1250" stroke="#2b3654"/><text x="48" y="1276" font-size="12" fill="#93a1bd" font-weight="400" text-anchor="start">Resources from platform-repo/dev manifests (30 Sep 2026). Measured totals: full-app ~2.0 GiB at rest (28 Sep 2026).</text><text x="1432" y="1276" font-size="11" fill="#55617d" font-weight="400" text-anchor="end">AquaShop  /  docs/diagrams/physical.svg</text></svg>