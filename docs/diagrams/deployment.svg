<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1260"
     viewBox="0 0 1480 1260" font-family="DejaVu Sans, Segoe UI, sans-serif" role="img" aria-label="AquaShop deployment topology">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#93a1bd"/></marker>
  <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker>
  <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-end"><path d="M0,0 L10,5 L0,10 z" fill="#ff9a4d"/></marker>
</defs>
<rect width="1480" height="1260" fill="#0f1725"/>
<rect x="48" y="34" width="7" height="46" fill="#3ddc97"/><text x="70" y="76" font-size="36" font-weight="700" fill="#e6ecf5"><tspan fill="#3ddc97">Deployment</tspan> Topology</text><text x="72" y="102" font-size="14" fill="#93a1bd">What actually runs, beside what it is designed to become.</text><rect x="1010" y="44" width="108.4" height="22" rx="11" fill="#3ddc97" opacity="0.14"/><rect x="1010" y="44" width="108.4" height="22" rx="11" fill="none" stroke="#3ddc97" opacity="0.55"/><text x="1064.2" y="59" font-size="11" text-anchor="middle" fill="#3ddc97" font-weight="600">RUNS LOCALLY</text><rect x="1128.4" y="44" width="180.4" height="22" rx="11" fill="#ff9a4d" opacity="0.14"/><rect x="1128.4" y="44" width="180.4" height="22" rx="11" fill="none" stroke="#ff9a4d" opacity="0.55"/><text x="1218.6000000000001" y="59" font-size="11" text-anchor="middle" fill="#ff9a4d" font-weight="600">VALIDATED, NOT APPLIED</text><rect x="48" y="120" width="760" height="980" rx="12" fill="#182032" stroke="#3ddc97" stroke-width="1.5"/><text x="66" y="146" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">ACTUALLY RUNNING — WINDOWS 11 / WSL2 / 16 GB</text><rect x="72" y="158" width="712" height="56" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="86" y="182" font-size="14.5" font-weight="700" fill="#93a1bd">Windows 11 host</text><text x="86" y="201" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">16 GB total, ~4-5 GB reserved for Windows</text><rect x="88" y="230" width="680" height="56" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="102" y="254" font-size="14.5" font-weight="700" fill="#93a1bd">WSL2 (Ubuntu)</text><text x="102" y="273" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">~11 GB usable via .wslconfig (was 7.4 GB unconfigured; applied by 22 Sep 2026)</text><rect x="104" y="302" width="648" height="56" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="118" y="326" font-size="14.5" font-weight="700" fill="#93a1bd">Docker Engine (native in WSL, not Docker Desktop)</text><text x="118" y="345" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">one container per k3d node</text><rect x="120" y="374" width="616" height="706" rx="9" fill="#182032" stroke="#3ddc97" stroke-width="1.5"/><text x="134" y="398" font-size="14.5" font-weight="700" fill="#3ddc97">k3d node container — k3s v1.30</text><text x="134" y="417" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">traefik: disabled | servicelb: disabled | metrics-server: disabled</text><text x="144" y="446" font-size="11.5" fill="#93a1bd" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">NAMESPACE  ingress-nginx</text><rect x="144" y="458" width="568" height="50" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="158" y="482" font-size="14.5" font-weight="700" fill="#e6ecf5">ingress-nginx controller</text><text x="158" y="501" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">hostPort 80/443 -&gt; 127.0.0.1</text><text x="144" y="542" font-size="11.5" fill="#93a1bd" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">NAMESPACE  cert-manager</text><rect x="144" y="554" width="568" height="50" rx="9" fill="#1d2740" stroke="#2b3654" stroke-width="1.5"/><text x="158" y="578" font-size="14.5" font-weight="700" fill="#e6ecf5">cert-manager + CA issuer</text><text x="158" y="597" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">self-signed root, in-cluster leaf</text><text x="144" y="638" font-size="11.5" fill="#93a1bd" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">NAMESPACE  aquashop-dev   (ResourceQuota 3Gi / 4Gi) — full-app: all eight run</text><rect x="144" y="650" width="180" height="70" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="158" y="674" font-size="14.5" font-weight="700" fill="#3ddc97">storefront</text><text x="158" y="693" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Node, 33 MiB</text><rect x="338" y="650" width="180" height="70" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="352" y="674" font-size="14.5" font-weight="700" fill="#3ddc97">catalog-service</text><text x="352" y="693" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">JVM, 272 MiB</text><rect x="532" y="650" width="180" height="70" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="546" y="674" font-size="14.5" font-weight="700" fill="#3ddc97">order-service</text><text x="546" y="693" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">JVM, 220 MiB</text><rect x="144" y="734" width="180" height="70" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="158" y="758" font-size="14.5" font-weight="700" fill="#3ddc97">inventory-service</text><text x="158" y="777" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Go, 4 MiB</text><rect x="338" y="734" width="180" height="70" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="352" y="758" font-size="14.5" font-weight="700" fill="#3ddc97">payment-service</text><text x="352" y="777" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Rust, 1 MiB</text><rect x="532" y="734" width="180" height="70" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="546" y="758" font-size="14.5" font-weight="700" fill="#3ddc97">aquatics-advisor</text><text x="546" y="777" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Python, 43 MiB</text><rect x="144" y="818" width="180" height="70" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="158" y="842" font-size="14.5" font-weight="700" fill="#3ddc97">notification-service</text><text x="158" y="861" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Go, 4 MiB</text><rect x="338" y="818" width="374" height="70" rx="9" fill="#1d2740" stroke="#3ddc97" stroke-width="1.5"/><text x="352" y="842" font-size="14.5" font-weight="700" fill="#3ddc97">staff-portal</text><text x="352" y="861" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">WildFly, 383 MiB  (own ingress host: staff.*)</text><rect x="144" y="902" width="568" height="70" rx="9" fill="#1d2740" stroke="#4cc9f0" stroke-width="1.5"/><text x="158" y="926" font-size="14.5" font-weight="700" fill="#4cc9f0">postgres (StatefulSet, PVC on local-path)</text><text x="158" y="945" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">61 MiB — databases: catalog, orders, inventory, payments, notify</text><text x="144" y="1008" font-size="11.5" fill="#ff9a4d" font-weight="400" text-anchor="start">No uat or prod overlay exists yet; Argo CD (the platform profile) has no manifests.</text><text x="144" y="1028" font-size="11.5" fill="#ff9a4d" font-weight="400" text-anchor="start">One environment is materialised at a time. None has ever run concurrently with another.</text><rect x="832" y="120" width="600" height="980" rx="12" fill="#182032" stroke="#ff9a4d" stroke-width="1.5"/><text x="850" y="146" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93a1bd">TARGET DESIGN — AWS (NEVER APPLIED)</text><rect x="856" y="158" width="552" height="52" rx="9" fill="#1d2740" stroke="#ff9a4d" stroke-width="1.5"/><text x="870" y="182" font-size="14.5" font-weight="700" fill="#ff9a4d">Route 53  -&gt;  ACM  -&gt;  ALB (internet-facing)</text><text x="870" y="201" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">public subnets, 2 AZs</text><rect x="856" y="226" width="552" height="52" rx="9" fill="#1d2740" stroke="#55617d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="870" y="250" font-size="14.5" font-weight="700" fill="#93a1bd">AWS Load Balancer Controller</text><text x="870" y="269" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">reads Ingress, writes target groups (IP mode)</text><rect x="856" y="294" width="552" height="96" rx="9" fill="#1d2740" stroke="#55617d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="870" y="318" font-size="14.5" font-weight="700" fill="#93a1bd">EKS managed node group</text><text x="870" y="337" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">private subnets  |  VPC CNI, pod IPs from the subnet</text><text x="870" y="356" font-size="11.5" fill="#55617d">Pod IP exhaustion is subnet arithmetic, not a node limit</text><rect x="856" y="406" width="264" height="76" rx="9" fill="#1d2740" stroke="#55617d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="870" y="430" font-size="14.5" font-weight="700" fill="#93a1bd">RDS PostgreSQL</text><text x="870" y="449" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">Multi-AZ, per service</text><rect x="1144" y="406" width="264" height="76" rx="9" fill="#1d2740" stroke="#55617d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1158" y="430" font-size="14.5" font-weight="700" fill="#93a1bd">ECR</text><text x="1158" y="449" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">immutable tags, scan on push</text><rect x="856" y="498" width="264" height="76" rx="9" fill="#1d2740" stroke="#55617d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="870" y="522" font-size="14.5" font-weight="700" fill="#93a1bd">Secrets Manager</text><text x="870" y="541" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">read via IRSA</text><rect x="1144" y="498" width="264" height="76" rx="9" fill="#1d2740" stroke="#55617d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1158" y="522" font-size="14.5" font-weight="700" fill="#93a1bd">NAT GW + VPC endpoints</text><text x="1158" y="541" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">egress, private ECR pulls</text><rect x="856" y="596" width="552" height="108" rx="9" fill="#1d2740" stroke="#ff9a4d" stroke-width="1.5"/><text x="870" y="620" font-size="14.5" font-weight="700" fill="#ff9a4d">Terraform modules</text><text x="870" y="639" font-size="12" font-family="DejaVu Sans Mono, ui-monospace, monospace" fill="#93a1bd">network | eks | rds | ecr | iam</text><text x="872" y="664" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">CI: fmt -&gt; validate -&gt; tflint -&gt; checkov -&gt; terraform test</text><text x="872" y="684" font-size="11.5" fill="#ff9a4d" font-weight="400" text-anchor="start">No backend, no credentials, no apply. Module wiring is proven; AWS behaviour is not.</text><text x="856" y="736" font-size="12.5" fill="#e6ecf5" font-weight="700" text-anchor="start">Failure modes I must be able to explain without having reproduced them:</text><text x="872" y="762" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">- subnet discovery tags — a missing kubernetes.io/role/elb and the ALB is never created</text><text x="872" y="784" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">- pod IP exhaustion — /24 per subnet is 251 usable IPs, shared by nodes and pods</text><text x="872" y="806" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">- IRSA — the pod&#x27;s service account token is exchanged for STS credentials</text><text x="872" y="828" font-size="11.5" fill="#93a1bd" font-weight="400" text-anchor="start">- Multi-AZ failover — DNS flip, connection pools must reconnect, not a zero-downtime event</text><line x1="790" y1="500" x2="826" y2="500" stroke="#ff9a4d" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowO)"/><text x="808" y="478" font-size="10" fill="#ff9a4d" font-weight="400" text-anchor="middle">maps to</text><line x1="48" y1="1150" x2="1432" y2="1150" stroke="#2b3654"/><text x="48" y="1176" font-size="12" fill="#93a1bd" font-weight="400" text-anchor="start">Measured, kubectl top node: core 1.32 GiB and core+commerce 2.05 GiB (16 Sep); full-app 2.0 GiB (28 Sep 2026).</text><text x="1432" y="1176" font-size="11" fill="#55617d" font-weight="400" text-anchor="end">AquaShop  /  docs/diagrams/deployment.svg</text></svg>